<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Sei offline — Praising</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbf8ff;
        --fg: #1b1b1f;
        --muted: #46464f;
        --accent: #4a5c92;
        --accent-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131317;
          --fg: #e4e1e9;
          --muted: #c7c5d0;
          --accent: #b4c5ff;
          --accent-fg: #1b2d5f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-right, 0px))
          calc(24px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px));
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 1.75rem;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-fg);
        text-decoration: none;
        font-weight: 600;
      }
      .hint {
        margin-top: 1.5rem;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sei offline</h1>
      <p>
        Questa pagina non è ancora stata salvata sul dispositivo. I canti che
        hai già scaricato restano disponibili dall'elenco.
      </p>
      <a href="/songs">Vai ai canti</a>
      <p class="hint">
        Per avere tutto il repertorio offline attiva
        <strong>Disponibilità offline</strong> nelle impostazioni.
      </p>
    </main>
    <script>
      // Se la rete torna mentre questa pagina è aperta, si riprova da soli.
      window.addEventListener('online', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
